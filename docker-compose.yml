services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sip_snug_app
    restart: always
    tty: true
    env_file: .env
    working_dir: /var/www
    volumes:
      - app_data:/var/www
    networks:
      - sip_snug_network
    depends_on:
      - db

  webserver:
    image: nginx:alpine
    container_name: sip_snug_webserver
    restart: always
    tty: true
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - sip_snug_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: sip_snug_db
    restart: always
    tty: true
 HEAD
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: NTI
      MYSQL_ROOT_PASSWORD: secretpassword
      MYSQL_PASSWORD: secretpassword
      MYSQL_USER: sip_snug

    env_file: .env
 df77a8f (chore: update docker-compose ports and nginx configurations)
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - sip_snug_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: sip_snug_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: secretpassword
    networks:
      - sip_snug_network
    depends_on:
      - db

networks:
  sip_snug_network:
    driver: bridge

volumes:
  app_data:
    driver: local
  db_data:
    driver: local
